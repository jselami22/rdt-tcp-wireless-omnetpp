#-----------------------------------------------------------------------------
[Config Wireless01]
description = Two hosts communicating wirelessly
network = WirelessA
sim-time-limit = 20s

*.host*.ipv4.arp.typename = "GlobalArp"

*.hostA.numApps = 1
*.hostA.app[0].typename = "UdpBasicApp"
*.hostA.app[0].destAddresses = "hostB"
*.hostA.app[0].destPort = 5000
*.hostA.app[0].messageLength = 1000B
*.hostA.app[0].sendInterval = exponential(12ms)
*.hostA.app[0].packetName = "UDPData"

*.hostB.numApps = 1
*.hostB.app[0].typename = "UdpSink"
*.hostB.app[0].localPort = 5000

*.host*.wlan[0].typename = "AckingWirelessInterface"
*.host*.wlan[0].mac.useAck = false
*.host*.wlan[0].mac.fullDuplex = false
*.host*.wlan[0].radio.transmitter.communicationRange = 500m
*.host*.wlan[0].radio.receiver.ignoreInterference = true
*.host*.wlan[0].mac.headerLength = 23B

*.host*.**.bitrate = 1Mbps

#-----------------------------------------------------------------------------
[Config Wireless02]
description = Setting up some animations
extends = Wireless01

*.hostA.wlan[0].radio.displayCommunicationRange = true

*.visualizer.sceneVisualizer.descriptionFigure = "title"

*.visualizer.mediumVisualizer.displaySignals = true

*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.physicalLinkVisualizer.packetFilter = "UDPData*"

#-----------------------------------------------------------------------------
[Config Wireless03]
description = Adding more nodes and decreasing the communication range
extends = Wireless02
network = WirelessB

*.host*.wlan[0].radio.transmitter.communicationRange = 250m

*.hostR1.wlan[0].radio.displayCommunicationRange = true

#-----------------------------------------------------------------------------
[Config Wireless04]
description = Setting up static routing
extends = Wireless03

*.host*.forwarding = true

*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/><autoroute metric='errorRate'/></config>")
*.configurator.optimizeRoutes = false
*.host*.ipv4.routingTable.netmaskRoutes = ""

*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.*LinkVisualizer.lineShift = 0
*.visualizer.networkRouteVisualizer.lineShift = 0
*.visualizer.networkRouteVisualizer.packetFilter = "UDPData*"

#-----------------------------------------------------------------------------
[Config Wireless05]
description = Taking interference into account
extends = Wireless04

*.host*.wlan[0].radio.receiver.ignoreInterference = false
*.host*.wlan[0].radio.transmitter.interferenceRange = 500m

*.hostA.wlan[0].radio.displayInterferenceRange = true

*.visualizer.dataLinkVisualizer.packetFilter = ""

#-----------------------------------------------------------------------------
[Config Wireless06]
description = Using CSMA to better utilize the medium
extends = Wireless05

*.host*.wlan[0].typename = "WirelessInterface"
*.host*.wlan[0].radio.typename = "UnitDiskRadio"
*.host*.wlan[0].mac.typename = "CsmaCaMac"
*.host*.wlan[0].mac.ackTimeout = 300us
*.host*.wlan[0].queue.typename = "DropTailQueue"
*.host*.wlan[0].queue.packetCapacity = -1

#-----------------------------------------------------------------------------
[Config Wireless07]
description = Turning on ACKs in CSMA
extends = Wireless06

*.host*.wlan[0].mac.useAck = true

#-----------------------------------------------------------------------------
[Config Wireless08]
description = Modeling energy consumption
extends = Wireless07

*.host*.wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host*.wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.sleepPowerConsumption = 1mW
*.host*.wlan[0].radio.energyConsumer.switchingPowerConsumption = 1mW
*.host*.wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
*.host*.wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 5mW
*.host*.wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
*.host*.wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 2mW
*.host*.wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW

*.host*.energyStorage.typename = "IdealEpEnergyStorage"

*.host*.wlan[0].radio.displayInterferenceRange = false
*.hostR1.wlan[0].radio.displayCommunicationRange = false

*.visualizer.mediumVisualizer.displaySignals = false

#-----------------------------------------------------------------------------
[Config Wireless09]
description = Configuring node movements
extends = Wireless08

*.hostR*.mobility.typename = "LinearMobility"
*.hostR*.mobility.speed = 12mps
*.hostR*.mobility.initialMovementHeading = 270deg

*.host*.wlan[0].queue.packetCapacity = 10

*.visualizer.mobilityVisualizer.displayVelocities = true
*.visualizer.mobilityVisualizer.displayMovementTrails = true

#-----------------------------------------------------------------------------
[Config Wireless10]
description = Configuring ad-hoc routing (AODV)
extends = Wireless09

*.configurator.addStaticRoutes = false

*.host*.typename = "AodvRouter"

*.hostB.wlan[0].radio.displayCommunicationRange = true

*.visualizer.dataLinkVisualizer.packetFilter = "AODV*"

#-----------------------------------------------------------------------------
[Config Wireless11]
description = Adding obstacles to the environment
extends = Wireless10
network = WirelessC

*.host*.mobility.initialZ = 1.7m

*.physicalEnvironment.config = xmldoc("walls.xml")
*.radioMedium.obstacleLoss.typename = "IdealObstacleLoss"

#-----------------------------------------------------------------------------
[Config Wireless12]
description = Changing to a more realistic radio model
extends = Wireless11

*.radioMedium.typename = "ApskScalarRadioMedium"
*.radioMedium.backgroundNoise.power = -90dBm
*.radioMedium.mediumLimitCache.centerFrequency = 2GHz

*.host*.wlan[0].radio.typename = "ApskScalarRadio"
*.host*.wlan[0].radio.centerFrequency = 2GHz
*.host*.wlan[0].radio.bandwidth = 2MHz
*.host*.wlan[0].radio.transmitter.power = 1.4mW
*.host*.wlan[0].radio.transmitter.preambleDuration = 10us
*.host*.wlan[0].radio.transmitter.headerLength = 8B
*.host*.wlan[0].radio.receiver.sensitivity = -85dBm
*.host*.wlan[0].radio.receiver.energyDetection = -85dBm
*.host*.wlan[0].radio.receiver.snirThreshold = 4dB

*.hostR1.wlan[*].radio.bitErrorRate.result-recording-modes = default,+vector

#TCP Implementation
#-----------------------------------------------------------------------------
[Config Wireless13]
description = Configuring a more accurate pathloss model
extends = Wireless12

*.physicalEnvironment.ground.typename = "FlatGround"
*.physicalEnvironment.ground.elevation = 0m

*.radioMedium.pathLoss.typename = "TwoRayGroundReflection"


#-----------------------------------------------------------------------------
[Config Wireless13_TCP_Static]
description = Q2: TCP Performance - Antenna Power Sweep (Static Nodes)
extends = Wireless13
sim-time-limit = 60s

#Disable obstacle loss for reliable communication
*.radioMedium.obstacleLoss.typename = ""

#Static relay nodes
*.hostR*.mobility.typename = "StationaryMobility"


#ANTENNA POWER SWEEP 
*.host*.wlan[0].radio.transmitter.power = ${antennaPower = 5mW, 10mW, 20mW, 50mW}


# TCP APPLICATIONS

#HostA: TCP Client
*.hostA.numApps = 1
*.hostA.app[0].typename = "TcpBasicClientApp"
*.hostA.app[0].connectAddress = "hostB"
*.hostA.app[0].connectPort = 1000
*.hostA.app[0].startTime = 2s
*.hostA.app[0].numRequestsPerSession = 100
*.hostA.app[0].requestLength = 1000B
*.hostA.app[0].replyLength = 100B
*.hostA.app[0].thinkTime = 0.01s
*.hostA.app[0].idleInterval = 1s
*.hostA.app[0].reconnectInterval = 1s

#HostB: TCP Server
*.hostB.numApps = 1
*.hostB.app[0].typename = "TcpGenericServerApp"
*.hostB.app[0].localPort = 1000
*.hostB.app[0].replyDelay = 0s

#Relay hosts: No applications
*.hostR*.numApps = 0


# TCP CONFIGURATION

*.host*.tcp.typename = "Tcp"
*.host*.tcp.sackSupport = true
*.host*.tcp.windowScalingSupport = true
*.host*.tcp.timestampSupport = true
*.host*.tcp.tcpAlgorithmClass = "TcpReno"
*.host*.tcp.recordStats = true


#STATISTICS - TCP State Variables

#Congestion window
*.host*.tcp.conn-*.cwnd:vector.result-recording-modes = default
*.host*.tcp.conn-*.cwnd:stats.result-recording-modes = default

#Slow start threshold
*.host*.tcp.conn-*.ssthresh:vector.result-recording-modes = default
*.host*.tcp.conn-*.ssthresh:stats.result-recording-modes = default

#RTT and RTT variance
*.host*.tcp.conn-*.rtt:vector.result-recording-modes = default
*.host*.tcp.conn-*.rtt:stats.result-recording-modes = default
*.host*.tcp.conn-*.rttvar:vector.result-recording-modes = default

#Retransmission timeout
*.host*.tcp.conn-*.rto:vector.result-recording-modes = default
*.host*.tcp.conn-*.rto:stats.result-recording-modes = default

#Retransmission counter
*.host*.tcp.conn-*.numRtos:vector.result-recording-modes = default

#Duplicate ACKs
*.host*.tcp.conn-*.dupAcks:vector.result-recording-modes = default

#Flight size 
*.host*.tcp.conn-*.sndWnd:vector.result-recording-modes = default
*.host*.tcp.conn-*.sndNxt:vector.result-recording-modes = default
*.host*.tcp.conn-*.sndUna:vector.result-recording-modes = default

#MSS
*.host*.tcp.conn-*.mss:stats.result-recording-modes = default


#STATISTICS - Performance Metrics

#Packets sent/received for delivery ratio
*.hostA.app[0].packetSent:count.result-recording-modes = default
*.hostA.app[0].packetReceived:count.result-recording-modes = default
*.hostB.app[0].packetSent:count.result-recording-modes = default
*.hostB.app[0].packetReceived:count.result-recording-modes = default

#Bytes for throughput calculation
*.hostA.app[0].packetSent:sum(packetBytes).result-recording-modes = default
*.hostA.app[0].packetReceived:sum(packetBytes).result-recording-modes = default
*.hostB.app[0].packetSent:sum(packetBytes).result-recording-modes = default
*.hostB.app[0].packetReceived:sum(packetBytes).result-recording-modes = default


#STATISTICS - Network Behavior 

#Packet drops at MAC layer
*.host*.wlan[0].mac.packetDropped:count.result-recording-modes = default
*.host*.wlan[0].mac.*.packetDropped:count.result-recording-modes = default

#Packet drops at radio layer
*.host*.wlan[0].radio.packetDropped:count.result-recording-modes = default

#Queue length (bottleneck)
*.host*.wlan[0].mac.queue.queueLength:vector.result-recording-modes = default
*.host*.wlan[0].mac.queue.queueLength:timeavg.result-recording-modes = default
*.host*.wlan[0].mac.queue.queueingTime:vector.result-recording-modes = default


#STATISTICS - PHY/MAC Layer

#SNR 
*.host*.wlan[0].radio.minSnir:vector.result-recording-modes = default
*.host*.wlan[0].radio.minSnir:histogram.result-recording-modes = default
*.host*.wlan[0].radio.minSnir:stats.result-recording-modes = default

#Packet error rate
*.host*.wlan[0].radio.packetErrorRate:vector.result-recording-modes = default
*.host*.wlan[0].radio.packetErrorRate:histogram.result-recording-modes = default

#Bit error rate
*.host*.wlan[0].radio.bitErrorRate:vector.result-recording-modes = default

#MAC retransmissions
*.host*.wlan[0].mac.dcf.channelAccess.contention.numCollision:vector.result-recording-modes = default
*.host*.wlan[0].mac.dcf.channelAccess.contention.numCollision:stats.result-recording-modes = default

#Reception power (RSSI)
*.host*.wlan[0].radio.receptionPower:vector.result-recording-modes = default
*.host*.wlan[0].radio.receptionPower:histogram.result-recording-modes = default




**.scalar-recording = true
**.vector-recording = true

#-----------------------------------------------------------------------------

[Config Wireless14]
description = Introducing antenna gain
extends = Wireless13

*.host*.wlan[0].radio.antenna.typename = "ConstantGainAntenna"
*.host*.wlan[0].radio.antenna.gain = 3dB

#-----------------------------------------------------------------------------

