[General]
network = Rdt3Network

# Channel parameters (vary these in experiments)
**.s2c.per = ${channelPer = 0.0, 0.1, 0.2}
**.c2s.per = ${channelPer}
**.s2c.datarate = 10Mbps
**.c2s.datarate = 10Mbps
**.s2c.delay = 10ms
**.c2s.delay = 10ms

# Client/server parameters
**.client.maxMsgSize = 1000B
**.client.requestTime = 0s
**.server.maxMsgSize = 1000B
**.server.windowSize = ${windowSize = 1, 10, 100}
**.server.fileSizeBytes = 200000B
**.server.timeout = 0.2s # Experiment different timeout values